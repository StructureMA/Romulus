<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Center</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0f1219;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Top Bar ── */
  .top-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    position: sticky;
    top: 0;
    background: #0f1219;
    z-index: 10;
  }
  .top-bar .title {
    font-weight: 700;
    font-size: 18px;
    white-space: nowrap;
    color: #f1f5f9;
    letter-spacing: -0.3px;
  }
  .badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    background: rgba(255,255,255,0.06);
    color: #94a3b8;
    font-weight: 500;
  }
  .scan-date {
    font-size: 11px;
    color: #475569;
    white-space: nowrap;
  }
  #save-indicator {
    font-size: 12px;
    color: #22c55e;
    opacity: 0;
    transition: opacity 0.3s ease;
    white-space: nowrap;
    font-weight: 500;
  }
  .spacer { flex: 1; }
  #search {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 7px 14px;
    color: #e2e8f0;
    font-size: 13px;
    width: 220px;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }
  #search:focus {
    border-color: rgba(99,102,241,0.5);
    background: rgba(255,255,255,0.07);
  }
  #search::placeholder { color: #475569; }
  #rescan-btn {
    background: rgba(59,130,246,0.15);
    color: #60a5fa;
    border: 1px solid rgba(59,130,246,0.25);
    border-radius: 8px;
    padding: 7px 16px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  #rescan-btn:hover { background: rgba(59,130,246,0.25); }
  #rescan-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ── Filters ── */
  .filters {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    flex-wrap: wrap;
  }
  .filter-pill {
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 6px;
    background: rgba(255,255,255,0.04);
    color: #94a3b8;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    user-select: none;
  }
  .filter-pill:hover { background: rgba(255,255,255,0.07); }
  .filter-pill.active { color: #e2e8f0; }
  .filter-pill.active[data-filter-status="all"],
  .filter-pill.active[data-filter-type="all"] {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.15);
  }
  .filter-pill.active[data-filter-status="active"] {
    background: rgba(16,185,129,0.15);
    border-color: rgba(16,185,129,0.3);
    color: #6ee7b7;
  }
  .filter-pill.active[data-filter-status="paused"] {
    background: rgba(245,158,11,0.15);
    border-color: rgba(245,158,11,0.3);
    color: #fcd34d;
  }
  .filter-pill.active[data-filter-status="archived"] {
    background: rgba(100,116,139,0.12);
    border-color: rgba(100,116,139,0.3);
    color: #94a3b8;
  }
  .filter-pill.active[data-filter-type="mobile"] {
    background: rgba(99,102,241,0.15);
    border-color: rgba(99,102,241,0.3);
    color: #a5b4fc;
  }
  .filter-pill.active[data-filter-type="webapp"] {
    background: rgba(6,182,212,0.15);
    border-color: rgba(6,182,212,0.3);
    color: #67e8f9;
  }
  .filter-pill.active[data-filter-type="website"] {
    background: rgba(236,72,153,0.15);
    border-color: rgba(236,72,153,0.3);
    color: #f9a8d4;
  }
  .filter-pill.active[data-filter-type="backend"] {
    background: rgba(245,158,11,0.15);
    border-color: rgba(245,158,11,0.3);
    color: #fcd34d;
  }
  .filter-pill.active[data-filter-type="library"] {
    background: rgba(20,184,166,0.15);
    border-color: rgba(20,184,166,0.3);
    color: #5eead4;
  }
  .filter-divider {
    width: 1px;
    height: 20px;
    background: rgba(255,255,255,0.08);
    margin: 0 6px;
  }

  /* ── Stats Row ── */
  .stats {
    display: flex;
    gap: 12px;
    padding: 12px 24px;
  }
  .stat-box {
    padding: 10px 18px;
    border-radius: 10px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    min-width: 120px;
    transition: border-color 0.2s;
  }
  .stat-box .stat-value {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .stat-box .stat-label {
    font-size: 11px;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 2px;
  }
  .stat-active  { border-color: rgba(16,185,129,0.25); }
  .stat-active  .stat-value { color: #6ee7b7; }
  .stat-paused  { border-color: rgba(245,158,11,0.25); }
  .stat-paused  .stat-value { color: #fcd34d; }
  .stat-archived { border-color: rgba(100,116,139,0.2); }
  .stat-archived .stat-value { color: #94a3b8; }
  .stat-accounts { border-color: rgba(139,92,246,0.25); }
  .stat-accounts .stat-value { color: #c4b5fd; }

  /* ── Table ── */
  .table-wrap {
    overflow-x: auto;
    padding: 0 24px 24px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  thead th {
    color: #64748b;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 10px 12px;
    text-align: left;
    border-bottom: 2px solid rgba(255,255,255,0.08);
    cursor: pointer;
    white-space: nowrap;
    user-select: none;
    transition: color 0.15s;
    position: relative;
  }
  thead th:hover { color: #94a3b8; }
  thead th.sorted { color: #e2e8f0; }
  thead th .sort-arrow {
    font-size: 10px;
    margin-left: 3px;
    opacity: 0.6;
  }
  tbody tr {
    border-bottom: 1px solid rgba(255,255,255,0.04);
    cursor: pointer;
    transition: background 0.15s;
  }
  tbody tr:hover { background: rgba(255,255,255,0.03); }
  td {
    padding: 10px 12px;
    vertical-align: middle;
    white-space: nowrap;
  }

  /* Sticky first column */
  th:first-child, td:first-child {
    position: sticky;
    left: 0;
    background: #0f1219;
    z-index: 1;
  }
  tbody tr:hover td:first-child { background: #131720; }

  /* Project name cell */
  .project-name {
    font-weight: 600;
    color: #f1f5f9;
    font-size: 13px;
  }
  .package-name {
    font-size: 11px;
    color: #475569;
    font-weight: 400;
  }

  /* Badges */
  .badge-type, .badge-status {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 5px;
    font-weight: 500;
    white-space: nowrap;
  }
  .badge-status-active   { background: rgba(16,185,129,0.15); color: #6ee7b7; }
  .badge-status-paused   { background: rgba(245,158,11,0.15); color: #fcd34d; }
  .badge-status-archived { background: rgba(100,116,139,0.12); color: #94a3b8; }
  .badge-status-unset    { background: rgba(255,255,255,0.04); color: #475569; }

  .badge-type-mobile  { background: rgba(99,102,241,0.15); color: #a5b4fc; }
  .badge-type-webapp  { background: rgba(6,182,212,0.15); color: #67e8f9; }
  .badge-type-website { background: rgba(236,72,153,0.15); color: #f9a8d4; }
  .badge-type-backend { background: rgba(245,158,11,0.15); color: #fcd34d; }
  .badge-type-library { background: rgba(20,184,166,0.15); color: #5eead4; }
  .badge-type-unset   { background: rgba(255,255,255,0.04); color: #475569; }

  /* Service indicators */
  .svc-yes { color: #22c55e; font-size: 15px; font-weight: 600; }
  .svc-no  { color: #334155; }
  .td-center { text-align: center; }

  /* Account cell */
  .account-email {
    font-size: 12px;
    font-weight: 500;
  }

  /* Notes cell */
  .notes-text {
    font-style: italic;
    color: #64748b;
    font-size: 12px;
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── Expanded row + Edit Panel ── */
  tbody tr.expanded { background: rgba(255,255,255,0.04); }
  tbody tr.expanded td:first-child { background: #151a24; }
  .edit-panel td {
    padding: 0;
    background: #131720;
  }
  .edit-panel:hover td { background: #131720; }
  .edit-panel td:first-child { background: #131720; }
  .edit-inner {
    display: flex;
    gap: 20px;
    padding: 16px 24px;
    flex-wrap: wrap;
    align-items: flex-start;
  }
  .edit-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .edit-field label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #64748b;
  }
  .edit-field select,
  .edit-field textarea {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    color: #e2e8f0;
    font-size: 13px;
    padding: 6px 10px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }
  .edit-field select:focus,
  .edit-field textarea:focus {
    border-color: rgba(99,102,241,0.5);
  }
  .edit-field select { min-width: 130px; cursor: pointer; }
  .edit-field textarea {
    min-width: 260px;
    min-height: 60px;
    resize: vertical;
  }
  .edit-accounts-title {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #64748b;
    margin-bottom: 4px;
  }
  .edit-account-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .edit-account-row .svc-label {
    font-size: 11px;
    color: #94a3b8;
    min-width: 70px;
    text-transform: capitalize;
  }
  .edit-account-row select {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    color: #e2e8f0;
    font-size: 12px;
    padding: 4px 8px;
    font-family: inherit;
    outline: none;
    cursor: pointer;
    min-width: 180px;
  }

  /* ── Responsive ── */
  @media (max-width: 768px) {
    .top-bar { flex-wrap: wrap; padding: 12px 16px; }
    .stats { padding: 8px 16px; overflow-x: auto; }
    .filters { padding: 8px 16px; }
    .table-wrap { padding: 0 16px 16px; }
    #search { width: 160px; }
  }
</style>
</head>
<body>

<!-- Top Bar -->
<div class="top-bar">
  <span class="title">&#8984; Command Center</span>
  <span class="badge" id="project-count">0 projects</span>
  <span class="scan-date" id="scan-date"></span>
  <span id="save-indicator">Saved &#10003;</span>
  <div class="spacer"></div>
  <input type="text" id="search" placeholder="&#128269; Search...">
  <button id="rescan-btn">&#128260; Re-scan</button>
</div>

<!-- Filters -->
<div class="filters">
  <span class="filter-pill active" data-filter-status="all">All</span>
  <span class="filter-pill" data-filter-status="active">Active</span>
  <span class="filter-pill" data-filter-status="paused">Paused</span>
  <span class="filter-pill" data-filter-status="archived">Archived</span>
  <div class="filter-divider"></div>
  <span class="filter-pill" data-filter-type="mobile">&#128241; Mobile</span>
  <span class="filter-pill" data-filter-type="webapp">&#127760; Web App</span>
  <span class="filter-pill" data-filter-type="website">&#127968; Website</span>
  <span class="filter-pill" data-filter-type="backend">&#9881; Backend</span>
  <span class="filter-pill" data-filter-type="library">&#128230; Library</span>
</div>

<!-- Stats -->
<div class="stats">
  <div class="stat-box stat-active">
    <div class="stat-value" id="stat-active">0</div>
    <div class="stat-label">Active</div>
  </div>
  <div class="stat-box stat-paused">
    <div class="stat-value" id="stat-paused">0</div>
    <div class="stat-label">Paused</div>
  </div>
  <div class="stat-box stat-archived">
    <div class="stat-value" id="stat-archived">0</div>
    <div class="stat-label">Archived</div>
  </div>
  <div class="stat-box stat-accounts">
    <div class="stat-value" id="stat-accounts">0</div>
    <div class="stat-label">Accounts</div>
  </div>
</div>

<!-- Table -->
<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th data-col="name" style="min-width:160px">Project</th>
        <th data-col="type" style="min-width:80px">Type</th>
        <th data-col="status" style="min-width:75px">Status</th>
        <th data-col="github" style="min-width:60px" class="td-center">GitHub</th>
        <th data-col="vercel" style="min-width:60px" class="td-center">Vercel</th>
        <th data-col="expo" style="min-width:60px" class="td-center">Expo</th>
        <th data-col="firebase" style="min-width:60px" class="td-center">Firebase</th>
        <th data-col="supabase" style="min-width:70px" class="td-center">Supabase</th>
        <th data-col="cloudflare" style="min-width:80px" class="td-center">Cloudflare</th>
        <th data-col="netlify" style="min-width:60px" class="td-center">Netlify</th>
        <th data-col="account" style="min-width:150px">Account</th>
        <th data-col="notes" style="min-width:200px">Notes</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
</div>

<script>
// ── State ──
let appData = { scanDate: null, accounts: [], projects: {} };
let userData = { accounts: [], projects: {} };
let filters = { status: 'all', type: 'all', search: '' };
let sortCol = 'name';
let sortDir = 'asc';
let expandedRow = null;

// ── Type detection ──
const TYPE_LABELS = {
  mobile:  '&#128241; Mobile',
  webapp:  '&#127760; Web App',
  website: '&#127968; Website',
  backend: '&#9881; Backend',
  library: '&#128230; Library',
};

function detectType(project) {
  const s = project.services || {};
  if (s.expo) return 'mobile';
  if (s.cloudflare?.workerName) return 'backend';
  if (s.vercel || s.netlify) return 'webapp';
  return null;
}

function getProjectType(key, project) {
  return userData.projects[key]?.type || detectType(project) || null;
}

function getProjectStatus(key) {
  return userData.projects[key]?.status || null;
}

function getProjectNotes(key) {
  return userData.projects[key]?.notes || '';
}

function getProjectAccounts(key) {
  return userData.projects[key]?.accounts || {};
}

// ── Account color lookup ──
function getAccountColor(email) {
  const acct = appData.accounts.find(a => a.email === email);
  return acct?.color || '#94a3b8';
}

// ── Service check ──
function svcHtml(val) {
  return val ? '<span class="svc-yes">&#10003;</span>' : '<span class="svc-no">&mdash;</span>';
}

// ── Get filtered + sorted entries ──
function getEntries() {
  let entries = Object.entries(appData.projects);

  // Search
  if (filters.search) {
    const q = filters.search.toLowerCase();
    entries = entries.filter(([key, p]) => {
      const notes = getProjectNotes(key);
      return key.toLowerCase().includes(q)
        || (p.packageName || '').toLowerCase().includes(q)
        || notes.toLowerCase().includes(q);
    });
  }

  // Status filter
  if (filters.status !== 'all') {
    entries = entries.filter(([key]) => getProjectStatus(key) === filters.status);
  }

  // Type filter
  if (filters.type !== 'all') {
    entries = entries.filter(([key, p]) => getProjectType(key, p) === filters.type);
  }

  // Sort
  entries.sort((a, b) => {
    let va, vb;
    const [keyA, projA] = a;
    const [keyB, projB] = b;

    switch (sortCol) {
      case 'name':    va = keyA.toLowerCase(); vb = keyB.toLowerCase(); break;
      case 'type':    va = getProjectType(keyA, projA) || 'zzz'; vb = getProjectType(keyB, projB) || 'zzz'; break;
      case 'status':  va = getProjectStatus(keyA) || 'zzz'; vb = getProjectStatus(keyB) || 'zzz'; break;
      case 'notes':   va = getProjectNotes(keyA); vb = getProjectNotes(keyB); break;
      case 'account': {
        const aa = getProjectAccounts(keyA);
        const ab = getProjectAccounts(keyB);
        va = aa.default || Object.values(aa)[0] || 'zzz';
        vb = ab.default || Object.values(ab)[0] || 'zzz';
        break;
      }
      default: {
        // Service columns
        const svcA = projA.services?.[sortCol];
        const svcB = projB.services?.[sortCol];
        va = svcA ? 0 : 1;
        vb = svcB ? 0 : 1;
      }
    }

    if (va < vb) return sortDir === 'asc' ? -1 : 1;
    if (va > vb) return sortDir === 'asc' ? 1 : -1;
    return 0;
  });

  return entries;
}

// ── Render ──
function render() {
  const entries = getEntries();

  // Stats
  let active = 0, paused = 0, archived = 0;
  entries.forEach(([key]) => {
    const s = getProjectStatus(key);
    if (s === 'active') active++;
    else if (s === 'paused') paused++;
    else if (s === 'archived') archived++;
  });
  document.getElementById('stat-active').textContent = active;
  document.getElementById('stat-paused').textContent = paused;
  document.getElementById('stat-archived').textContent = archived;
  document.getElementById('stat-accounts').textContent = appData.accounts.length;

  // Top bar
  document.getElementById('project-count').textContent = entries.length + ' project' + (entries.length !== 1 ? 's' : '');
  const sd = appData.scanDate ? new Date(appData.scanDate) : null;
  document.getElementById('scan-date').textContent = sd
    ? 'Scanned ' + sd.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' at ' + sd.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })
    : '';

  // Sort headers
  document.querySelectorAll('thead th').forEach(th => {
    const col = th.dataset.col;
    th.classList.toggle('sorted', col === sortCol);
    const existing = th.querySelector('.sort-arrow');
    if (existing) existing.remove();
    if (col === sortCol) {
      const arrow = document.createElement('span');
      arrow.className = 'sort-arrow';
      arrow.innerHTML = sortDir === 'asc' ? '&#9650;' : '&#9660;';
      th.appendChild(arrow);
    }
  });

  // Table body
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = '';

  entries.forEach(([key, project]) => {
    const type = getProjectType(key, project);
    const status = getProjectStatus(key);
    const notes = getProjectNotes(key);
    const accounts = getProjectAccounts(key);
    const s = project.services || {};

    const tr = document.createElement('tr');
    if (expandedRow === key) tr.classList.add('expanded');
    tr.dataset.key = key;

    // Build account display
    let accountHtml = '<span class="svc-no">&mdash;</span>';
    const defaultAcct = accounts.default;
    const specificAccts = Object.entries(accounts).filter(([k]) => k !== 'default');
    if (defaultAcct) {
      const c = getAccountColor(defaultAcct);
      accountHtml = `<span class="account-email" style="color:${c}">${defaultAcct}</span>`;
    } else if (specificAccts.length > 0) {
      accountHtml = specificAccts.map(([svc, email]) => {
        const c = getAccountColor(email);
        return `<span class="account-email" style="color:${c}" title="${svc}">${email}</span>`;
      }).join('<br>');
    }

    // Type badge
    let typeHtml = '<span class="badge-type badge-type-unset">&mdash;</span>';
    if (type) {
      typeHtml = `<span class="badge-type badge-type-${type}">${TYPE_LABELS[type] || type}</span>`;
    }

    // Status badge
    let statusHtml = '<span class="badge-status badge-status-unset">&mdash;</span>';
    if (status) {
      const label = status.charAt(0).toUpperCase() + status.slice(1);
      statusHtml = `<span class="badge-status badge-status-${status}">${label}</span>`;
    }

    tr.innerHTML = `
      <td>
        <div class="project-name">${key}</div>
        ${project.packageName && project.packageName !== key ? `<div class="package-name">${project.packageName}</div>` : ''}
      </td>
      <td>${typeHtml}</td>
      <td>${statusHtml}</td>
      <td class="td-center">${svcHtml(s.github)}</td>
      <td class="td-center">${svcHtml(s.vercel)}</td>
      <td class="td-center">${svcHtml(s.expo)}</td>
      <td class="td-center">${svcHtml(s.firebase)}</td>
      <td class="td-center">${svcHtml(s.supabase)}</td>
      <td class="td-center">${svcHtml(s.cloudflare)}</td>
      <td class="td-center">${svcHtml(s.netlify)}</td>
      <td>${accountHtml}</td>
      <td><span class="notes-text">${notes || '<span class="svc-no">&mdash;</span>'}</span></td>
    `;

    tr.addEventListener('click', () => {
      expandedRow = expandedRow === key ? null : key;
      render();
    });

    tbody.appendChild(tr);

    // Edit panel
    if (expandedRow === key) {
      const editTr = document.createElement('tr');
      editTr.className = 'edit-panel';
      const editTd = document.createElement('td');
      editTd.colSpan = 12;

      const serviceNames = Object.keys(s);

      let accountsHtml = '';
      if (serviceNames.length > 0) {
        const accountOpts = appData.accounts.map(a =>
          `<option value="${a.email}">${a.email} (${a.label})</option>`
        ).join('');

        accountsHtml = `
          <div class="edit-field" style="min-width:240px">
            <div class="edit-accounts-title">Accounts</div>
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
              <span class="svc-label" style="min-width:70px">Default</span>
              <select data-account="default">
                <option value="">None</option>
                ${accountOpts}
              </select>
            </div>
            ${serviceNames.map(svc => `
              <div class="edit-account-row">
                <span class="svc-label">${svc}</span>
                <select data-account="${svc}">
                  <option value="">Use default</option>
                  ${accountOpts}
                </select>
              </div>
            `).join('')}
          </div>
        `;
      }

      editTd.innerHTML = `
        <div class="edit-inner">
          <div class="edit-field">
            <label>Status</label>
            <select data-field="status">
              <option value="">Unset</option>
              <option value="active" ${status === 'active' ? 'selected' : ''}>Active</option>
              <option value="paused" ${status === 'paused' ? 'selected' : ''}>Paused</option>
              <option value="archived" ${status === 'archived' ? 'selected' : ''}>Archived</option>
            </select>
          </div>
          <div class="edit-field">
            <label>Type</label>
            <select data-field="type">
              <option value="">Auto-detect</option>
              <option value="mobile" ${type === 'mobile' ? 'selected' : ''}>Mobile</option>
              <option value="webapp" ${type === 'webapp' ? 'selected' : ''}>Web App</option>
              <option value="website" ${type === 'website' ? 'selected' : ''}>Website</option>
              <option value="backend" ${type === 'backend' ? 'selected' : ''}>Backend</option>
              <option value="library" ${type === 'library' ? 'selected' : ''}>Library</option>
            </select>
          </div>
          <div class="edit-field">
            <label>Notes</label>
            <textarea data-field="notes">${notes}</textarea>
          </div>
          ${accountsHtml}
        </div>
      `;

      // Wire up change handlers
      editTd.querySelectorAll('select[data-field]').forEach(sel => {
        sel.addEventListener('change', (e) => {
          e.stopPropagation();
          if (!userData.projects[key]) userData.projects[key] = { status: null, type: null, notes: '', accounts: {} };
          userData.projects[key][sel.dataset.field] = sel.value || null;
          saveUserData();
          render();
        });
        sel.addEventListener('click', e => e.stopPropagation());
      });

      editTd.querySelectorAll('textarea[data-field]').forEach(ta => {
        ta.addEventListener('blur', () => {
          if (!userData.projects[key]) userData.projects[key] = { status: null, type: null, notes: '', accounts: {} };
          userData.projects[key].notes = ta.value;
          saveUserData();
          render();
        });
        ta.addEventListener('click', e => e.stopPropagation());
        ta.addEventListener('keydown', e => e.stopPropagation());
      });

      editTd.querySelectorAll('select[data-account]').forEach(sel => {
        const acctKey = sel.dataset.account;
        const currentAccounts = getProjectAccounts(key);
        sel.value = currentAccounts[acctKey] || '';
        sel.addEventListener('change', (e) => {
          e.stopPropagation();
          if (!userData.projects[key]) userData.projects[key] = { status: null, type: null, notes: '', accounts: {} };
          if (!userData.projects[key].accounts) userData.projects[key].accounts = {};
          if (sel.value) {
            userData.projects[key].accounts[acctKey] = sel.value;
          } else {
            delete userData.projects[key].accounts[acctKey];
          }
          saveUserData();
          render();
        });
        sel.addEventListener('click', e => e.stopPropagation());
      });

      editTr.appendChild(editTd);
      editTr.addEventListener('click', e => e.stopPropagation());
      tbody.appendChild(editTr);
    }
  });
}

// ── Save ──
async function saveUserData() {
  const indicator = document.getElementById('save-indicator');
  indicator.textContent = 'Saving...';
  indicator.style.opacity = '1';
  try {
    await fetch('/api/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(userData)
    });
    indicator.textContent = 'Saved \u2713';
    setTimeout(() => { indicator.style.opacity = '0'; }, 1500);
  } catch (err) {
    indicator.textContent = 'Save failed';
    indicator.style.color = '#ef4444';
    setTimeout(() => {
      indicator.style.opacity = '0';
      indicator.style.color = '#22c55e';
    }, 2000);
  }
}

// ── Load data ──
async function loadData() {
  try {
    const res = await fetch('/api/data');
    appData = await res.json();

    // Extract userData
    userData.accounts = appData.accounts || [];
    userData.projects = {};
    for (const [key, project] of Object.entries(appData.projects)) {
      const up = {};
      if (project.status) up.status = project.status;
      if (project.type) up.type = project.type;
      if (project.notes !== undefined && project.notes !== null) up.notes = project.notes || '';
      if (project.accounts) up.accounts = project.accounts || {};
      if (Object.keys(up).length > 0) userData.projects[key] = up;
    }

    render();
  } catch (err) {
    console.error('Failed to load data:', err);
  }
}

loadData();

// ── Sort ──
function sortBy(col) {
  if (sortCol === col) {
    sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    sortCol = col;
    sortDir = 'asc';
  }
  render();
}

document.querySelectorAll('thead th').forEach(th => {
  th.addEventListener('click', () => sortBy(th.dataset.col));
});

// ── Search ──
document.getElementById('search').addEventListener('input', (e) => {
  filters.search = e.target.value;
  render();
});

// ── Filter pills ──
document.querySelectorAll('.filter-pill[data-filter-status]').forEach(pill => {
  pill.addEventListener('click', () => {
    filters.status = pill.dataset.filterStatus;
    document.querySelectorAll('.filter-pill[data-filter-status]').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    render();
  });
});

document.querySelectorAll('.filter-pill[data-filter-type]').forEach(pill => {
  pill.addEventListener('click', () => {
    const val = pill.dataset.filterType;
    if (filters.type === val) {
      filters.type = 'all';
      document.querySelectorAll('.filter-pill[data-filter-type]').forEach(p => p.classList.remove('active'));
    } else {
      filters.type = val;
      document.querySelectorAll('.filter-pill[data-filter-type]').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
    }
    render();
  });
});

// ── Re-scan ──
document.getElementById('rescan-btn').addEventListener('click', async () => {
  const btn = document.getElementById('rescan-btn');
  btn.textContent = '\u23F3 Scanning...';
  btn.disabled = true;
  try {
    const res = await fetch('/api/scan', { method: 'POST' });
    const data = await res.json();
    appData = data;
    // Re-extract userData from merged data
    for (const [key, project] of Object.entries(appData.projects)) {
      if (!userData.projects[key]) {
        const up = {};
        if (project.status) up.status = project.status;
        if (project.type) up.type = project.type;
        if (project.notes !== undefined) up.notes = project.notes || '';
        if (project.accounts) up.accounts = project.accounts;
        if (Object.keys(up).length > 0) userData.projects[key] = up;
      }
    }
    render();
  } catch (err) {
    console.error('Scan failed:', err);
  }
  btn.textContent = '\uD83D\uDD04 Re-scan';
  btn.disabled = false;
});
</script>
